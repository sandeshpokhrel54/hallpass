# Create this once, and Argo CD deploys deploy/ from the `deploy` branch, which the
# build-and-deploy Action updates on every merge to main.
# Ask your agent to apply it through Radar's MCP server (apply_resource), or
# apply it from Radar Cloud. Your repo must be public so Argo CD can read it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: team-hallpass
spec:
  project: team-hallpass
  source:
    repoURL: https://github.com/sandeshpokhrel54/hallpass.git
    # Generated by the build-and-deploy Action from each merged main commit.
    targetRevision: deploy
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: team-hallpass
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
