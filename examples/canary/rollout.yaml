# The Deployment from deploy/deployment.yaml as an Argo Rollouts canary.
# Each new image goes to 25% of the pods and waits for you (or your agent)
# to promote it, then 50% for a minute, then everything.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line if you turn on the HPA.
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: app
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause: { duration: 60s }
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "hallpass"
            - name: ES_INDEX
              value: "hallpass-neurips-2025-v2"
            # Same Secret as deploy/deployment.yaml; keep the two in sync.
            - name: ES_URL
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: es-url
            - name: ES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: es-api-key
            # Dash0 (optional: pods start without it; telemetry is then off).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: dash0-credentials
                  key: otlp-endpoint
                  optional: true
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dash0-credentials
                  key: auth-token
                  optional: true
            - name: DASH0_RUM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dash0-credentials
                  key: rum-token
                  optional: true
            - name: DEPLOY_ENV
              value: "hackathon"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
