apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # The app never calls the Kubernetes API.
      automountServiceAccountToken: false
      # Keep the two replicas on different nodes when possible. ScheduleAnyway,
      # so a busy shared host never leaves a pod Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app
      volumes:
        # Writable scratch space; the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "hallpass"
            - name: ES_INDEX
              value: "hallpass-neurips-2025-v2"
            # Created by hand in the cluster, never in git (see README "Deploy").
            - name: ES_URL
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: es-url
            - name: ES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: es-api-key
            # Dash0 (optional: pods start without it; telemetry is then off).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: dash0-credentials
                  key: otlp-endpoint
                  optional: true
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dash0-credentials
                  key: auth-token
                  optional: true
            - name: DASH0_RUM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dash0-credentials
                  key: rum-token
                  optional: true
            - name: DEPLOY_ENV
              value: "hackathon"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
