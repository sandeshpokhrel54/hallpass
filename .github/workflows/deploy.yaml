# On every push to main (i.e. every merged PR): build the image, push it to GHCR,
# and force-push a commit pointing deploy/kustomization.yaml at it to the
# `deploy` branch. Argo CD tracks `deploy`, so main stays PR-only (the ruleset
# can't exempt the Actions bot on a personal repo) and every deploy is exactly
# the commit that was built.
name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/kustomization.yaml
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    # Only in your copy: the template repo itself keeps its placeholders.
    if: github.repository != 'skyhook-io/cnh-starter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Publish the deploy branch for Argo CD
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Start from the exact commit this run built, so manifests and image match.
          yq -i '(.images[] | select(.name == "app")) |= (.newName = strenv(IMAGE) | .newTag = strenv(TAG))' deploy/kustomization.yaml
          git commit -qam "deploy: ${TAG} [skip ci]"
          # Runs are serialized by the concurrency group, so the last merge wins.
          git push -f origin HEAD:refs/heads/deploy
